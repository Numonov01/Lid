<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lid qo'shish — 13 xil Premium Atir to'plami</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --card: #ffffff;
        --text: #1a1a1a;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-dark: #1d4ed8;
        --success: #16a34a;
        --error: #dc2626;
        --border: #e5e7eb;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f1115;
          --card: #1a1d23;
          --text: #f3f4f6;
          --muted: #9ca3af;
          --border: #2a2e37;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0f1115;
        --card: #1a1d23;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --border: #2a2e37;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 24px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      }
      .product-tag {
        display: inline-block;
        background: #fef3c7;
        color: #92400e;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 999px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .subtitle {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 24px;
      }
      label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font-size: 16px;
        margin-bottom: 16px;
        outline: none;
        transition: border-color 0.15s;
      }
      input:focus {
        border-color: var(--accent);
      }
      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: var(--accent-dark);
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .msg {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 14px;
        display: none;
      }
      .msg.success {
        display: block;
        background: rgba(22, 163, 74, 0.1);
        color: var(--success);
      }
      .msg.error {
        display: block;
        background: rgba(220, 38, 38, 0.1);
        color: var(--error);
      }
      .log {
        margin-top: 20px;
        border-top: 1px solid var(--border);
        padding-top: 16px;
      }
      .log h2 {
        font-size: 13px;
        color: var(--muted);
        margin: 0 0 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .log-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
        font-size: 14px;
      }
      .log-item:last-child {
        border-bottom: none;
      }
      .log-item .name {
        font-weight: 600;
      }
      .log-item .phone {
        color: var(--muted);
        font-size: 13px;
      }
      .log-item .status {
        font-size: 12px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
      }
      .status.ok {
        background: rgba(22, 163, 74, 0.12);
        color: var(--success);
      }
      .status.fail {
        background: rgba(220, 38, 38, 0.12);
        color: var(--error);
      }
      .empty {
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        padding: 12px 0;
      }
      .wrap {
        position: relative;
        max-width: 420px;
        width: 100%;
      }
      select {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 16px;
        margin-bottom: 16px;
        outline: none;
        cursor: pointer;
        transition: border-color 0.15s;
      }
      select:focus {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <span class="product-tag" id="productTag"
          >13 xil Premium Atir to'plami</span
        >
        <h1>Yangi lid qo'shish</h1>
        <p class="subtitle">
          Instagram/Facebook DM orqali kelgan mijoz ma'lumotini kiriting
        </p>

        <form id="leadForm">
          <label for="productSelect">Mahsulot</label>
          <select id="productSelect" required></select>

          <label for="name">Ism</label>
          <input
            type="text"
            id="name"
            placeholder="Masalan: Dilnoza"
            required
            autocomplete="off"
          />

          <label for="phone">Telefon raqami</label>
          <input
            type="tel"
            id="phone"
            placeholder="+998901234567"
            required
            autocomplete="off"
          />

          <button type="submit" id="submitBtn">Yuborish</button>
        </form>

        <div class="msg" id="msgBox"></div>

        <div class="log">
          <h2>So'nggi yuborilganlar</h2>
          <div id="logList">
            <div class="empty">Hali hech narsa yuborilmagan</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Forma va API bitta domenda (shu Vercel loyihasi), shuning uchun
      // nisbiy yo'l ishlatiladi — CORS sozlash shart emas.
      const PROXY_URL = "/api/lead";
      const API_KEY = "8235421784599192";

      // Barcha faol oqimlar: nom, oqim kaliti, offer_id.
      // Yangi mahsulot qo'shish uchun shu ro'yxatga bitta qator qo'shing.
      const PRODUCTS = [
        {
          label: "13 xil premium atir toplami",
          stream: "bmiFVhtk",
          offer: 278,
        },
        { label: "Feramon 21+ (30ML)", stream: "FJ0lBOwk", offer: 195 },
        { label: "Ozdiruvchi choy", stream: "oFQHr6By", offer: 255 },
        { label: "Guruch Nabor", stream: "3V4cqpBv", offer: 105 },
        {
          label: "Hujjat va kitoblar uchun papka",
          stream: "hhlxfARN",
          offer: 259,
        },
        { label: "Skeleton soat", stream: "UNStErBm", offer: 262 },
        { label: "Deyl Karnegi 4 ta qism", stream: "4EJKKR5y", offer: 60 },
        { label: "Harvard Metodi", stream: "0C6l1rLN", offer: 285 },
      ];

      const form = document.getElementById("leadForm");
      const msgBox = document.getElementById("msgBox");
      const submitBtn = document.getElementById("submitBtn");
      const logList = document.getElementById("logList");
      const productSelect = document.getElementById("productSelect");
      const productTag = document.getElementById("productTag");

      // Select'ni mahsulotlar bilan to'ldirish
      PRODUCTS.forEach((p, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = p.label;
        productSelect.appendChild(opt);
      });

      // Oxirgi tanlangan mahsulotni eslab qolish (qulaylik uchun)
      try {
        const lastIndex = localStorage.getItem("last_product_index");
        if (lastIndex !== null && PRODUCTS[lastIndex])
          productSelect.value = lastIndex;
      } catch (e) {}

      function updateProductTag() {
        const p = PRODUCTS[productSelect.value];
        if (p) productTag.textContent = p.label;
      }
      updateProductTag();

      productSelect.addEventListener("change", function () {
        updateProductTag();
        try {
          localStorage.setItem("last_product_index", productSelect.value);
        } catch (e) {}
      });

      let history = [];
      try {
        const saved = localStorage.getItem("lead_history");
        if (saved) history = JSON.parse(saved);
      } catch (e) {}

      function renderLog() {
        if (history.length === 0) {
          logList.innerHTML =
            '<div class="empty">Hali hech narsa yuborilmagan</div>';
          return;
        }
        logList.innerHTML = history
          .slice(0, 10)
          .map(
            (item) => `
      <div class="log-item">
        <div>
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="phone">${escapeHtml(item.phone)}${item.product ? " · " + escapeHtml(item.product) : ""}</div>
        </div>
        <span class="status ${item.ok ? "ok" : "fail"}">${item.ok ? "Yuborildi" : "Xato"}</span>
      </div>
    `,
          )
          .join("");
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function saveHistory() {
        try {
          localStorage.setItem(
            "lead_history",
            JSON.stringify(history.slice(0, 30)),
          );
        } catch (e) {}
      }

      renderLog();

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const product = PRODUCTS[productSelect.value];

        if (!name || !phone) {
          showMsg("error", "Ism va telefon raqamini kiriting");
          return;
        }
        if (!product) {
          showMsg("error", "Mahsulotni tanlang");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Yuborilmoqda...";
        msgBox.className = "msg";

        try {
          const res = await fetch(PROXY_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              api_key: API_KEY,
              stream: product.stream,
              offer_id: product.offer,
              name: name,
              phone: phone,
            }),
          });

          const text = await res.text();
          let data;
          try {
            data = JSON.parse(text);
          } catch (e) {
            data = { raw: text };
          }

          // Xavi.uz muvaffaqiyatda {ok:true} yoki {success:true} qaytaradi,
          // xatoda {success:false, message:"..."} qaytaradi — HTTP status 200
          // bo'lsa ham xato bo'lishi mumkin, shuning uchun ikkalasini ham tekshiramiz.
          const isSuccess =
            res.ok && data && data.success !== false && data.ok !== false;

          if (isSuccess) {
            showMsg("success", "Muvaffaqiyatli yuborildi! ✅");
            history.unshift({
              name,
              phone,
              product: product.label,
              ok: true,
              time: Date.now(),
            });
            form.reset();
            document.getElementById("name").focus();
          } else {
            showMsg(
              "error",
              "Xatolik: " + (data.message || data.raw || res.status),
            );
            history.unshift({
              name,
              phone,
              product: product ? product.label : "",
              ok: false,
              time: Date.now(),
            });
          }
        } catch (err) {
          showMsg(
            "error",
            "Tarmoq xatosi: " +
              err.message +
              ". Agar bu CORS xatosi bo'lsa, dasturchingizga murojaat qiling.",
          );
          history.unshift({
            name,
            phone,
            product: product ? product.label : "",
            ok: false,
            time: Date.now(),
          });
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Yuborish";
          saveHistory();
          renderLog();
        }
      });

      function showMsg(type, text) {
        msgBox.className = "msg " + type;
        msgBox.textContent = text;
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lid qo'shish — CRM</title>
<style>
  :root{
    --bg:#f4f5f7;
    --card:#ffffff;
    --text:#1a1a1a;
    --muted:#6b7280;
    --accent:#2563eb;
    --accent-dark:#1d4ed8;
    --success:#16a34a;
    --error:#dc2626;
    --border:#e5e7eb;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1115;
      --card:#1a1d23;
      --text:#f3f4f6;
      --muted:#9ca3af;
      --border:#2a2e37;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1115;
    --card:#1a1d23;
    --text:#f3f4f6;
    --muted:#9ca3af;
    --border:#2a2e37;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:16px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:28px 24px;
    max-width:420px;
    width:100%;
    box-shadow:0 4px 24px rgba(0,0,0,0.06);
  }
  .tabs{
    display:flex;
    gap:6px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:4px;
    margin-bottom:10px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:9px 8px;
    border-radius:9px;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
    border:none;
    background:transparent;
    transition:background .15s, color .15s;
  }
  .tab.active{
    background:var(--accent);
    color:#fff;
  }
  .accounts{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:18px;
  }
  .accounts:empty{ margin-bottom:0; }
  .account-chip{
    padding:6px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
    border:1px solid var(--border);
    background:transparent;
    transition:background .15s, color .15s, border-color .15s;
  }
  .account-chip.active{
    background:rgba(37,99,235,0.12);
    color:var(--accent);
    border-color:var(--accent);
  }
  .product-tag{
    display:inline-block;
    background:#fef3c7;
    color:#92400e;
    font-size:12px;
    font-weight:600;
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:12px;
  }
  h1{
    font-size:20px;
    margin:0 0 4px;
  }
  .subtitle{
    color:var(--muted);
    font-size:14px;
    margin:0 0 24px;
  }
  label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:6px;
  }
  input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:transparent;
    color:var(--text);
    font-size:16px;
    margin-bottom:16px;
    outline:none;
    transition:border-color .15s;
  }
  input:focus{
    border-color:var(--accent);
  }
  button[type="submit"]{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s;
  }
  button[type="submit"]:hover{ background:var(--accent-dark); }
  button[type="submit"]:disabled{ opacity:0.6; cursor:not-allowed; }
  .msg{
    margin-top:16px;
    padding:12px 14px;
    border-radius:10px;
    font-size:14px;
    display:none;
  }
  .msg.success{
    display:block;
    background:rgba(22,163,74,0.1);
    color:var(--success);
  }
  .msg.error{
    display:block;
    background:rgba(220,38,38,0.1);
    color:var(--error);
  }
  .log{
    margin-top:20px;
    border-top:1px solid var(--border);
    padding-top:16px;
  }
  .log h2{
    font-size:13px;
    color:var(--muted);
    margin:0 0 10px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .log-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .log-item:last-child{ border-bottom:none; }
  .log-item .name{ font-weight:600; }
  .log-item .phone{ color:var(--muted); font-size:13px; }
  .log-item .status{
    font-size:12px;
    font-weight:600;
    padding:2px 8px;
    border-radius:999px;
  }
  .status.ok{ background:rgba(22,163,74,0.12); color:var(--success); }
  .status.fail{ background:rgba(220,38,38,0.12); color:var(--error); }
  .empty{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    padding:12px 0;
  }
  .wrap{ position:relative; max-width:420px; width:100%; }
  select{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:16px;
    margin-bottom:16px;
    outline:none;
    cursor:pointer;
    transition:border-color .15s;
  }
  select:focus{ border-color:var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
  <div class="card">
    <div class="tabs" id="platformTabs"></div>
    <div class="accounts" id="accountChips"></div>

    <span class="product-tag" id="productTag">—</span>
    <h1>Yangi lid qo'shish</h1>
    <p class="subtitle">Instagram/Facebook DM orqali kelgan mijoz ma'lumotini kiriting</p>

    <form id="leadForm">
      <label for="productSelect">Mahsulot</label>
      <select id="productSelect" required></select>

      <label for="name">Ism</label>
      <input type="text" id="name" placeholder="Masalan: Dilnoza" required autocomplete="off">

      <label for="phone">Telefon raqami</label>
      <input type="tel" id="phone" placeholder="+998901234567" required autocomplete="off">

      <button type="submit" id="submitBtn">Yuborish</button>
    </form>

    <div class="msg" id="msgBox"></div>

    <div class="log">
      <h2>So'nggi yuborilganlar</h2>
      <div id="logList">
        <div class="empty">Hali hech narsa yuborilmagan</div>
      </div>
    </div>
  </div>
  </div>

<script>
  // Forma va API bitta domenda (shu Vercel loyihasi), shuning uchun

  // Platformalar (CRM'lar). Har bir platformada bir nechta akkaunt bo'lishi
  // mumkin (masalan bir nechta API key). Yangi akkaunt qo'shish uchun

  const PLATFORMS = {

            { label: 'Feramon 1+1',                                    stream: 'pqnHOnFk', offer: 282 },
            { label: 'Louis Vuitton (LV) atirlari 1+1 45ml (4)',       stream: 'aWnLHTAm', offer: 198 },
            { label: 'Tamaki Tashlashga Yordam Beruvchi Kukun',        stream: 'I0Ljgx7P', offer: 288 },
            { label: 'Katushka Aparat',                                stream: 'rphyb19o', offer: 302 },
            { label: 'SCORPION BAUME DE NERFS — 100 GR',               stream: '3ASBfwIF', offer: 295 },
          ],

          products: [

            { label: 'Feramon (Feromon)',                           stream: 'ipRWXTV1', offer: 169 },

            { label: 'Mini Blendr',                                  stream: 'To2zyPgM', offer: 205 },
            { label: 'Feramon (1+1) Ayollar va Erkaklar',            stream: 'jRqD4lar', offer: 203 },

            { label: 'Avtomobil uchun katta asvijitel',               stream: 'no0pxJcz', offer: 181 },
            { label: 'Mukoshafatul qulub — Qalblar kashfiyoti',      stream: 'ydpyK90f', offer: 15  },
            { label: 'Qur\'oni Karim manolarini tarjimasi',           stream: 'r3j2ZuqM', offer: 252 },

            { label: 'Sidr Kukuni 79',                                stream: 'qvJizBEt', offer: 278 },
            { label: 'Tamaki Tashlashga Yordam Beruvchi Kukun',       stream: '8iklqQDR', offer: 288 },
            { label: 'HB-P18 Fonar',                                  stream: 'pSVMNwCq', offer: 4   },
            { label: 'Wi-Fi Simsiz mini-kamera',                      stream: 'DyBaauPK', offer: 150 },
            { label: 'Nafis taqinchoqlar to\'plami',                  stream: 'uvaihFZU', offer: 233 },

            { label: 'Innova kreatin shampun',                        stream: 'Nxpz1egn', offer: 317 },
          ],
        },
      ],
    },
    xavi: {
      accounts: [
        {
          id: 'tokhir',
          label: 'Tokhir',
          api_key: '8235421784599192',
          products: [
            { label: '13 xil premium atir toplami',               stream: 'bmiFVhtk', offer: 278 },
            { label: 'Feramon 21+ (30ML)',                          stream: 'FJ0lBOwk', offer: 195 },
            { label: 'Tuyaqush Yog\'i',                              stream: 'DE02SMXx', offer: 201 },
            { label: 'Zero Fit 100 GR',                              stream: 'WfuCP8Uw', offer: 215 },
            { label: 'Snayper (erkaklar uchun)',                     stream: 'Cjk4DzPp', offer: 222 },
            { label: 'Sauvage atirlari — 2 tasi birda 45ML',         stream: 'gmDpiZLF', offer: 235 },
            { label: 'Sauvage atirlari (new)',                       stream: 'eBgVzzYx', offer: 235 },
            { label: 'Tamaki tashlashga yordam beruvchi kukun',      stream: 'yumftflv', offer: 236 },
            { label: 'Hula Hoop',                                    stream: 'sBY3FcZE', offer: 239 },
            { label: 'Saheb Eau De Parfum (oddiy)',                  stream: '0Ds9pL2B', offer: 242 },
            { label: 'Ozdiruvchi choy',                              stream: 'oFQHr6By', offer: 255 },
            { label: 'Tribunis — tabiiy energiya ichimligi',         stream: '3X8HxiPK', offer: 252 },
            { label: 'Guruch Nabor',                                 stream: '3V4cqpBv', offer: 105 },
            { label: 'Hujjat va kitoblar uchun papka',               stream: 'hhlxfARN', offer: 259 },
            { label: 'Skeleton soat',                                stream: 'UNStErBm', offer: 262 },
            { label: 'Belkis Prenses Hamam Otu',                     stream: '3up6qCRQ', offer: 263 },
            { label: 'Sidr sovun',                                   stream: '3qftdSe1', offer: 264 },
            { label: 'Original Pheromone atiri 30ML',                stream: 'DzZA2abn', offer: 272 },
            { label: 'Moviy toplam ayollar uchun',                   stream: 'Y5FUKutq', offer: 92  },
            { label: 'Deyl Karnegi 4 ta qism',                       stream: '4EJKKR5y', offer: 60  },
            { label: 'Harvard Metodi',                                stream: '0C6l1rLN', offer: 285 },
          ],
        },
      ],
    },
  };

  const platformTabs = document.getElementById('platformTabs');
  const accountChips = document.getElementById('accountChips');
  const form = document.getElementById('leadForm');
  const msgBox = document.getElementById('msgBox');
  const submitBtn = document.getElementById('submitBtn');
  const logList = document.getElementById('logList');
  const productSelect = document.getElementById('productSelect');
  const productTag = document.getElementById('productTag');

  let activePlatform = 'xavi';
  try {
    const saved = localStorage.getItem('active_platform');
    if (saved && PLATFORMS[saved]) activePlatform = saved;
  } catch(e) {}

  // Platforma tab'larini chizish
  Object.keys(PLATFORMS).forEach(key => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tab' + (key === activePlatform ? ' active' : '');
    btn.textContent = PLATFORM_LABELS[key] || key;
    btn.dataset.platform = key;
    btn.addEventListener('click', () => switchPlatform(key));
    platformTabs.appendChild(btn);
  });

  function getActiveAccountId(platformKey){
    try {
      const saved = localStorage.getItem('active_account_' + platformKey);
      if (saved && PLATFORMS[platformKey].accounts.some(a => a.id === saved)) return saved;
    } catch(e) {}
    return PLATFORMS[platformKey].accounts[0].id;
  }

  function switchPlatform(key){
    activePlatform = key;
    try { localStorage.setItem('active_platform', key); } catch(e) {}

    [...platformTabs.children].forEach(btn => {
      btn.classList.toggle('active', btn.dataset.platform === key);
    });

    switchAccount(getActiveAccountId(key));
  }

  function getAccount(){
    const platform = PLATFORMS[activePlatform];
    const accountId = getActiveAccountId(activePlatform);
    return platform.accounts.find(a => a.id === accountId) || platform.accounts[0];
  }

  function switchAccount(accountId){
    try { localStorage.setItem('active_account_' + activePlatform, accountId); } catch(e) {}

    const accounts = PLATFORMS[activePlatform].accounts;

    // Akkaunt chiplarini chizish — faqat bir nechta akkaunt bo'lsa ko'rsatiladi
    accountChips.innerHTML = '';
    if (accounts.length > 1){
      accounts.forEach(acc => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'account-chip' + (acc.id === accountId ? ' active' : '');
        chip.textContent = acc.label;
        chip.dataset.account = acc.id;
        chip.addEventListener('click', () => switchAccount(acc.id));
        accountChips.appendChild(chip);
      });
    }

    const account = accounts.find(a => a.id === accountId) || accounts[0];
    const products = account.products;

    productSelect.innerHTML = '';
    products.forEach((p, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = p.label;
      productSelect.appendChild(opt);
    });

    try {
      const lastIndex = localStorage.getItem('last_product_index_' + activePlatform + '_' + accountId);
      if (lastIndex !== null && products[lastIndex]) productSelect.value = lastIndex;
    } catch(e) {}

    updateProductTag();
  }

  function updateProductTag(){
    const account = getAccount();
    const p = account.products[productSelect.value];
    if (p) productTag.textContent = p.label + ' · ' + (PLATFORM_LABELS[activePlatform] || activePlatform) + ' (' + account.label + ')';
  }

  productSelect.addEventListener('change', function(){
    updateProductTag();
    try { localStorage.setItem('last_product_index_' + activePlatform + '_' + getAccount().id, productSelect.value); } catch(e) {}
  });

  // Boshlang'ich holatni yuklash
  switchPlatform(activePlatform);

  let history = [];
  try {
    const saved = localStorage.getItem('lead_history');
    if (saved) history = JSON.parse(saved);
  } catch(e) {}

  function renderLog(){
    if (history.length === 0){
      logList.innerHTML = '<div class="empty">Hali hech narsa yuborilmagan</div>';
      return;
    }
    logList.innerHTML = history.slice(0, 10).map(item => `
      <div class="log-item">
        <div>
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="phone">${escapeHtml(item.phone)}${item.product ? ' · ' + escapeHtml(item.product) : ''}${item.providerLabel ? ' · ' + escapeHtml(item.providerLabel) : ''}</div>
        </div>
        <span class="status ${item.ok ? 'ok' : 'fail'}">${item.ok ? 'Yuborildi' : 'Xato'}</span>
      </div>
    `).join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function saveHistory(){
    try {
      localStorage.setItem('lead_history', JSON.stringify(history.slice(0,30)));
    } catch(e) {}
  }

  renderLog();

  form.addEventListener('submit', async function(e){
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const account = getAccount();
    const product = account.products[productSelect.value];

    if (!name || !phone){
      showMsg('error', 'Ism va telefon raqamini kiriting');
      return;
    }
    if (!product){
      showMsg('error', 'Mahsulotni tanlang');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Yuborilmoqda...';
    msgBox.className = 'msg';

    try {
      const res = await fetch(PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          provider: activePlatform,
          api_key: account.api_key,
          stream: product.stream,
          offer_id: product.offer,
          name: name,
          phone: phone
        })
      });

      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch(e) { data = { raw: text }; }

      // CRM muvaffaqiyatda {ok:true} yoki {success:true} qaytaradi,
      // xatoda {success:false, message:"..."} qaytaradi — HTTP status 200
      // bo'lsa ham xato bo'lishi mumkin, shuning uchun ikkalasini ham tekshiramiz.
      const isSuccess = res.ok && data && data.success !== false && data.ok !== false;

      const providerLabel = (PLATFORM_LABELS[activePlatform] || activePlatform) + ' (' + account.label + ')';

      if (isSuccess){
        showMsg('success', 'Muvaffaqiyatli yuborildi! ✅');
        history.unshift({ name, phone, product: product.label, providerLabel, ok: true, time: Date.now() });
        form.reset();
        document.getElementById('name').focus();
      } else {
        showMsg('error', 'Xatolik: ' + (data.message || data.raw || res.status));
        history.unshift({ name, phone, product: product ? product.label : '', providerLabel, ok: false, time: Date.now() });
      }
    } catch (err) {
      showMsg('error', 'Tarmoq xatosi: ' + err.message + '. Agar bu CORS xatosi bo\'lsa, dasturchingizga murojaat qiling.');
      const providerLabel = (PLATFORM_LABELS[activePlatform] || activePlatform) + ' (' + account.label + ')';
      history.unshift({ name, phone, product: product ? product.label : '', providerLabel, ok: false, time: Date.now() });
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Yuborish';
      saveHistory();
      renderLog();
    }
  });

  function showMsg(type, text){
    msgBox.className = 'msg ' + type;
    msgBox.textContent = text;
  }
</script>
</body>
</html>

<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lid qo'shish — CRM</title>
    <link rel="stylesheet" href="src/styles/theme.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/switcher.css" />
    <link rel="stylesheet" href="src/styles/form.css" />
    <link rel="stylesheet" href="src/styles/history.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="tabs" id="platformTabs"></div>
        <div class="accounts" id="accountChips"></div>

        <span class="product-tag" id="productTag">—</span>
        <h1>Yangi lid qo'shish</h1>
        <p class="subtitle">
          Instagram/Facebook DM orqali kelgan mijoz ma'lumotini kiriting
        </p>

        <form id="leadForm">
          <label for="productSelect">Mahsulot</label>
          <select id="productSelect" required></select>

          <label for="name">Ism</label>
          <input
            type="text"
            id="name"
            placeholder="Masalan: Dilnoza"
            required
            autocomplete="off"
          />

          <label for="phone">Telefon raqami</label>
          <input
            type="tel"
            id="phone"
            placeholder="+998901234567"
            required
            autocomplete="off"
          />

          <button type="submit" id="submitBtn">Yuborish</button>
        </form>

        <div class="msg" id="msgBox"></div>

        <div class="log">
          <div class="log-head">
            <h2>So'nggi yuborilganlar</h2>
            <a href="history.html" id="historyMore" hidden>To'liq ko'rish →</a>
          </div>
          <div id="logList"></div>
        </div>
      </div>
    </div>
  </body>
</html>
